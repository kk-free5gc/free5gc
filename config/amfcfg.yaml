info:
  version: 1.0.9
  description: AMF initial local configuration

configuration:
  amfName: AMF # the name of this AMF
  ngapIpList:  # the IP list of N2 interfaces on this AMF
    - 192.168.0.2
  ngapPort: 38412 # the SCTP port listened by NGAP

  # Service-based Interface (SBI) Configuration
  sbi:
    scheme: http # the protocol for sbi (http or https)
    registerIPv4: 127.0.0.18 # IP used to register to NRF
    bindingIPv4: 127.0.0.18  # IP used to bind the service
    port: 8000 # port used to bind the service
    tls: # the local path of TLS key
      pem: cert/amf.pem # AMF TLS Certificate
      key: cert/amf.key # AMF TLS Private key

  # SBI Services offered by this AMF, as per TS 29.518
  serviceNameList:
    - namf-comm # Namf_Communication service
    - namf-evts # Namf_EventExposure service
    - namf-mt   # Namf_MT service
    - namf-loc  # Namf_Location service
    - namf-oam  # OAM service

  # Guami (Globally Unique AMF ID) list supported by this AMF
  servedGuamiList:
    # <GUAMI> = <MCC><MNC><AMF ID>
    # CHT
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 466 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 11 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      amfId: cafe00 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)
    # Amarisoft
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 001 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 01 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      amfId: cafe01 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)
    # Verizon
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 311 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 480 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      amfId: cafe02 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)
    # T-mobile
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 310 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 260 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      amfId: cafe03 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)

  # the TAI (Tracking Area Identifier) list supported by this AMF
  supportTaiList:
    # CHT
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 466 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 11 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
    # Amarisoft
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 001 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 01 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
    # Verizon
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 311 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 480 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
    # T-mobile
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 310 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 260 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)

  # the PLMNs (Public land mobile network) list supported by this AMF
  plmnSupportList:
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 466 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 11 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          # sd omitted so this entry matches requests with SST=1 and no SD
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 0007d0 # 2000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb8 # 3000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb9 # 3001, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 2 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 3 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 001 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 01 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          # sd omitted so this entry matches requests with SST=1 and no SD
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 0007d0 # 2000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb8 # 3000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb9 # 3001, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 2 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 3 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 311 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 480 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          # sd omitted so this entry matches requests with SST=1 and no SD
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 0007d0 # 2000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb8 # 3000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb9 # 3001, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 2 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 3 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 310 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 260 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          # sd omitted so this entry matches requests with SST=1 and no SD
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 0007d0 # 2000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb8 # 3000, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 000bb9 # 3001, Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 2 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 3 # Slice/Service Type (uinteger, range: 0~255)
          sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)

  # the DNN (Data Network Name) list supported by this AMF
  supportDnnList:
    - fast.t-mobile.com
    - internet
    - ims
    - sos
    - V5GA01INTERNET
    - vzwadmin
    - wnctest

  nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem # NRF Certificate

  # NAS Security Configuration
  # the priority of integrity algorithms
  # the priority of ciphering algorithms
  security:
    integrityOrder:
      - NIA1
      - NIA0
    cipheringOrder:
      - NEA0
      - NEA1

  # Network Name Information
  networkName:
    full: free5GC
    short: free

  # Optional NGAP Information Elements (IE)
  ngapIE:
    mobilityRestrictionList: # Mobility Restriction List IE, refer to TS 38.413
      enable: true # append this IE in related message or not
    maskedIMEISV: # Masked IMEISV IE, refer to TS 38.413
      enable: true # append this IE in related message or not
    redirectionVoiceFallback: # Redirection Voice Fallback IE, refer to TS 38.413
      enable: false # append this IE in related message or not

  # Optional NAS Information Elements (IE)
  nasIE:
    networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501
      enable: true # append this IE in Registration accept or not
      length: 1 # IE content length (uinteger, range: 1~3)
      imsVoPS: 0 # IMS voice over PS session indicator (uinteger, range: 0~1)
      emc: 0 # Emergency service support indicator for 3GPP access (uinteger, range: 0~3)
      emf: 0 # Emergency service fallback indicator for 3GPP access (uinteger, range: 0~3)
      iwkN26: 0 # Interworking without N26 interface indicator (uinteger, range: 0~1)
      mpsi: 0 # MPS indicator (uinteger, range: 0~1)
      emcN3: 0 # Emergency service support indicator for Non-3GPP access (uinteger, range: 0~1)
      mcsi: 0 # MCS indicator (uinteger, range: 0~1)
  t3502Value: 720  # timer value (seconds) at UE side
  t3512Value: 3600 # timer value (seconds) at UE side
  non3gppDeregTimerValue: 3240 # timer value (seconds) at UE side
  # retransmission timer for paging message
  t3513:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Deregistration Request message
  t3522:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Registration Accept message
  t3550:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Configuration Update Command message
  t3555:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Authentication Request/Security Mode Command message
  t3560:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Notification message
  t3565:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  # retransmission timer for NAS Identity Request message
  t3570:
    enable: true     # true or false
    expireTime: 6s   # default is 6 seconds
    maxRetryTimes: 4 # the max number of retransmission
  locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located

  # set the sctp server setting <optinal>, once this field is set, please also add maxInputStream, maxOsStream, maxAttempts, maxInitTimeOut
  sctp:
    numOstreams: 3 # the maximum out streams of each sctp connection
    maxInstreams: 5 # the maximum in streams of each sctp connection
    maxAttempts: 2 # the maximum attempts of each sctp connection
    maxInitTimeout: 2 # the maximum init timeout of each sctp connection
  defaultUECtxReq: false # the default value of UE Context Request to decide when triggering Initial Context Setup procedure
  # WNC: treat a FOR=0 Initial Registration as if Follow-On Request = 1, so the AMF keeps
  # the N2/RRC connection after registration (instead of releasing immediately) and the UE
  # can set up its default PDU session without looping. Bounded by the gNB RRC inactivity
  # timer. Default false = stock behaviour.
  treatInitialRegAsFollowOn: true
  # WNC: master switch for UE Policy (URSP) delivery to the UE via the DL NAS Transport
  # "Manage UE Policy Command" after registration. Gates all delivery paths (PCF 3GPP flow,
  # legacy TriggerUEPolicyDelivery, and PCF-notification SendUEPolicyToUE). Omit the field to
  # keep the existing (enabled) behaviour; set to false to stop the AMF from sending it.
  enableUEPolicy: true
  # [WNC] Selects how the Registration Accept "Allowed NSSAI" IE is populated when the UE
  # sends no (matching) Requested NSSAI:
  #   default             - stock: advertise only the default-indicated subscribed slice
  #   allSubscribedNoReq  - advertise ALL subscribed slices this AMF supports (all SIM slices)
  #   allSubscribedAlways - reserved for future use; currently same as allSubscribedNoReq
  # Omit the field for stock (default) behaviour.
  allowedNssaiMode: allSubscribedAlways

logger: # log output setting
  enable: true # true or false
  level: trace # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not, value: true or false
