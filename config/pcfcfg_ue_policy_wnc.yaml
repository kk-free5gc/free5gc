# Top-level key corresponding to the "UE policy section management list" Information Element (IE).
# This IE is the mandatory payload of a "Manage UE Policy Command" message.
# The dissector function is `de_nas_5gs_updp_ue_policy_section_mgm_lst`.
policySectionManagementList:

  # Each item in this list is a "UE policy section management sublist".
  # Each sublist is scoped to a specific PLMN, allowing for different policies
  # for home and visited networks.

  # --- Sublist for PLMN 50501 ---
  # The PLMN ID is composed of MCC (Mobile Country Code) and MNC (Mobile Network Code).
  # This is parsed by the `dissect_e212_mcc_mnc` function in the dissector.
  - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
      mcc: 466 # Mobile Country Code (3 digits string, digit: 0~9)
      mnc: 11 # Mobile Network Code (2 or 3 digits string, digit: 0~9)

    # A list of "instructions" for the UE for this PLMN.
    # The dissector loops through these instructions within a sublist.
    instructions:

      # Each item represents a single instruction block.
      # --- Instruction 1 ---
      # UPSC: UE Policy Section Counter. A sequence number for this update.
      # The UE uses this to track updates and acknowledge them.
      # Corresponds to the `hf_nas_5gs_updp_upsc` field in the dissector.
      - upsc: 1

        # A list of policy parts contained within this instruction.
        # You can include multiple parts, like URSP and ANDSP, in the same instruction.
        policyParts:

          # --- Policy Part 1: URSP ---
          # The type of policy being defined. This is critical.
          # 'URSP' corresponds to ue_policy_part_type = 1.
          # 'ANDSP' corresponds to ue_policy_part_type = 2.
          # The dissector uses this value in a switch statement to call the correct
          # sub-dissector, e.g., `de_nas_5gs_ue_policies_ursp` for type 1.
          - type: URSP

            # A list of URSP rules. This is the core of the UE Route Selection Policy.
            # The dissector enters the `de_nas_5gs_ue_policies_ursp` function here.
            urspRules:

              # --- Rule 1: High-priority rule for IMS voice traffic ---
              # Precedence determines the order of evaluation. Lower numbers are evaluated first.
              # A packet is matched against rules in order of precedence.
              # Corresponds to the `hf_nas_5gs_ursp_rule_prec` field.
              - precedence: 10

                # The Traffic Descriptor defines what traffic this rule applies to.
                # It's a list of components that are logically ANDed.
                # Dissected by the `de_nas_5gs_ursp_traff_desc` function.
                # Check each type defination in nas_5gs_ursp_traff_desc_component_type_values
                trafficDescriptor:
                  - type: DNN # Data Network Name type.
                    value: "V5GA01INTERNET"

                # Defines what to do with the matched traffic. This is a list of routing
                # options, ordered by their own precedence. The UE tries them in order.
                # Dissected by the `de_nas_5gs_ursp_r_sel_desc` function.
                # Check each type defination in nas_5gs_ursp_r_sel_desc_comp_type_values
                routeSelectionDescriptors:
                  - precedence: 1 # The UE's first choice for this traffic.
                    components:
                      - type: S-NSSAI # Route via a specific Network Slice.
                        value: "1-000001" # Example: SST=1, SD=000001
                      - type: DNN
                        value: "V5GA01INTERNET"

              # --- Rule 2: Low-priority catch-all rule for general internet ---
              - precedence: 254
                trafficDescriptor:
                  - type: MatchAll # A special type that matches any traffic not caught by higher-priority rules.

                routeSelectionDescriptors:
                  # First choice: Route to the 'internet' DNN on the current access.
                  - precedence: 1
                    components:
                      - type: DNN
                        value: "internet"
                  # Second choice: If the first fails or isn't desired, prefer offloading to Wi-Fi.
                  - precedence: 10
                    components:
                      - type: PreferredAccessType
                        value: "Non-3GPP" # Tells the UE to prefer Wi-Fi if available.

          # --- Policy Part 2: ANDSP (Example) ---
          # You could define an ANDSP policy in the same instruction.
          # 'ANDSP' corresponds to ue_policy_part_type = 2.
          # The dissector would call a different function for this part.
          - type: ANDSP
            # (ANDSP rules would be defined here, with a different structure from URSP)
            andspRules: [] # Placeholder for ANDSP structure

