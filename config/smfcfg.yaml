info:
  version: 1.0.7
  description: SMF initial local configuration

configuration:
  smfName: SMF # the name of this SMF

  # Service-based interface information
  sbi:
    scheme: http # the protocol for sbi (http or https)
    registerIPv4: 127.0.0.2 # IP used to register to NRF
    bindingIPv4: 127.0.0.2 # IP used to bind the service
    port: 8000 # Port used to bind the service
    tls: # the local path of TLS key
      key: cert/smf.key # SMF TLS Certificate
      pem: cert/smf.pem # SMF TLS Private key

  # the SBI services provided by this SMF, refer to TS 29.502
  serviceNameList:
    - nsmf-pdusession # Nsmf_PDUSession service
    - nsmf-event-exposure # Nsmf_EventExposure service
    - nsmf-oam # OAM service

  # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
  snssaiInfos:
    - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
        sst: 1 # Slice/Service Type (uinteger, range: 0~255)
        sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      dnnInfos: # DNN information list
        - dnn: internet # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: ims # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: wnctest # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: vzwadmin # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: V5GA01INTERNET # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
    - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
        sst: 1 # Slice/Service Type (uinteger, range: 0~255)
        sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      dnnInfos: # DNN information list
        - dnn: internet # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: ims # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: wnctest # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: vzwadmin # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: V5GA01INTERNET # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
    - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
        sst: 2 # Slice/Service Type (uinteger, range: 0~255)
        sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      dnnInfos: # DNN information list
        - dnn: internet # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: ims # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: wnctest # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: vzwadmin # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: V5GA01INTERNET # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
    - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
        sst: 3 # Slice/Service Type (uinteger, range: 0~255)
        sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      dnnInfos: # DNN information list
        - dnn: internet # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: ims # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: wnctest # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: vzwadmin # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
        - dnn: V5GA01INTERNET # Data Network Name
          dns: # the IP address of DNS
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888

  # Optional: PLMN IDs configuration.
  plmnList:
    - mcc: 466 # Mobile Country Code (3 digits string, digit: 0~9)
      mnc: 11 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    - mcc: 001 # Mobile Country Code (3 digits string, digit: 0~9)
      mnc: 01 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    - mcc: 311 # Mobile Country Code (3 digits string, digit: 0~9)
      mnc: 480 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
  locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located

  # PFCP (Packet Forwarding Control Protocol) configuration for N4 interface.
  pfcp:
    # addr config is deprecated in smf config v1.0.3, please use the following config
    nodeID: 192.168.0.2 # the Node ID of this SMF
    listenAddr: 192.168.0.2 # the IP/FQDN of N4 interface on this SMF (PFCP)
    externalAddr: 192.168.0.2 # the IP/FQDN of N4 interface on this SMF (PFCP)
    assocFailAlertInterval: 10s
    assocFailRetryInterval: 30s
    heartbeatInterval: 10s

  # Userplane nodes information, specifying details for AN and UPF.
  userplaneInformation:
    upNodes: # information of userplane node (AN or UPF)
      gNB1: # the name of the node
        type: AN # the type of the node (AN or UPF)
      UPF: # the name of the node
        type: UPF # the type of the node (AN or UPF)
        nodeID: 5.5.5.2 # the Node ID of this UPF
        addr: 5.5.5.2 # the IP/FQDN of N4 interface on this UPF (PFCP)
        sNssaiUpfInfos: # S-NSSAI information list for this UPF
          - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
              sst: 1 # Slice/Service Type (uinteger, range: 0~255)
              sd: 000001 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
            dnnUpfInfoList: # DNN information list for this S-NSSAI
              - dnn: internet
                pools:
                  - cidr: 10.61.0.0/16
                staticPools:
                  - cidr: 10.61.100.0/24
              - dnn: ims
                pools:
                  - cidr: 10.62.0.0/16
                staticPools:
                  - cidr: 10.62.100.0/24
              - dnn: wnctest
                pools:
                  - cidr: 10.63.0.0/16
                staticPools:
                  - cidr: 10.63.100.0/24
              - dnn: vzwadmin
                pools:
                  - cidr: 10.64.0.0/16
                staticPools:
                  - cidr: 10.64.100.0/24
              - dnn: V5GA01INTERNET
                pools:
                  - cidr: 10.65.0.0/16
                staticPools:
                  - cidr: 10.65.100.0/24
          - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
              sst: 1 # Slice/Service Type (uinteger, range: 0~255)
              sd: 050601 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
            dnnUpfInfoList: # DNN information list for this S-NSSAI
              - dnn: internet
                pools:
                  - cidr: 10.71.0.0/16
                staticPools:
                  - cidr: 10.71.100.0/24
              - dnn: ims
                pools:
                  - cidr: 10.72.0.0/16
                staticPools:
                  - cidr: 10.72.100.0/24
              - dnn: wnctest
                pools:
                  - cidr: 10.73.0.0/16
                staticPools:
                  - cidr: 10.73.100.0/24
              - dnn: vzwadmin
                pools:
                  - cidr: 10.74.0.0/16
                staticPools:
                  - cidr: 10.74.100.0/24
              - dnn: V5GA01INTERNET
                pools:
                  - cidr: 10.75.0.0/16
                staticPools:
                  - cidr: 10.75.100.0/24
          - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
              sst: 2 # Slice/Service Type (uinteger, range: 0~255)
              sd: 050602 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
            dnnUpfInfoList: # DNN information list for this S-NSSAI
              - dnn: internet
                pools:
                  - cidr: 10.81.0.0/16
                staticPools:
                  - cidr: 10.81.100.0/24
              - dnn: ims
                pools:
                  - cidr: 10.82.0.0/16
                staticPools:
                  - cidr: 10.82.100.0/24
              - dnn: wnctest
                pools:
                  - cidr: 10.83.0.0/16
                staticPools:
                  - cidr: 10.83.100.0/24
              - dnn: vzwadmin
                pools:
                  - cidr: 10.84.0.0/16
                staticPools:
                  - cidr: 10.84.100.0/24
              - dnn: V5GA01INTERNET
                pools:
                  - cidr: 10.85.0.0/16
                staticPools:
                  - cidr: 10.85.100.0/24
          - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
              sst: 3 # Slice/Service Type (uinteger, range: 0~255)
              sd: 050603 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
            dnnUpfInfoList: # DNN information list for this S-NSSAI
              - dnn: internet
                pools:
                  - cidr: 10.91.0.0/16
                staticPools:
                  - cidr: 10.91.100.0/24
              - dnn: ims
                pools:
                  - cidr: 10.92.0.0/16
                staticPools:
                  - cidr: 10.92.100.0/24
              - dnn: wnctest
                pools:
                  - cidr: 10.93.0.0/16
                staticPools:
                  - cidr: 10.93.100.0/24
              - dnn: vzwadmin
                pools:
                  - cidr: 10.94.0.0/16
                staticPools:
                  - cidr: 10.94.100.0/24
              - dnn: V5GA01INTERNET
                pools:
                  - cidr: 10.95.0.0/16
                staticPools:
                  - cidr: 10.95.100.0/24

        # The IP address for the N3 interface must match the IP bound in the UPF N3 interface.
        # If UPF binds to a specific IP, set that same IP here.
        # If UPF binds to all IPs (0.0.0.0), you can set any of the available UPF IPs here.
        # Do NOT set 0.0.0.0 as this is not a valid routable address.
        interfaces: # Interface list for this UPF
          - interfaceType: N3 # the type of the interface (N3 or N9)
            endpoints: # the IP address of this N3/N9 interface on this UPF
              - 5.5.5.2
            networkInstances: # Data Network Name (DNN)
              - internet
              - ims
              - wnctest
              - vzwadmin
              - V5GA01INTERNET

    # the topology graph of userplane, A and B represent the two nodes of each link
    links:
      - A: gNB1
        B: UPF

  # retransmission timer for PDU session modification command
  t3591:
    enable: true # true or false
    expireTime: 16s # default is 6 seconds
    maxRetryTimes: 3 # the max number of retransmission

  # retransmission timer for PDU session release command
  t3592:
    enable: true # true or false
    expireTime: 16s # default is 6 seconds
    maxRetryTimes: 3 # the max number of retransmission

  nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem # NRF Certificate
  urrPeriod: 30 # default usage report period in seconds
  urrThreshold: 500000 # default usage report threshold in bytes
  requestedUnit: 1000

# Logging Configuration
logger:
  enable: true # true or false
  level: trace # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not, value: true or false
