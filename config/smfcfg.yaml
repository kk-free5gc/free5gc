        # The IP address for the N3 interface must match the IP bound in the UPF N3 interface.
        # If UPF binds to a specific IP, set that same IP here.
        # If UPF binds to all IPs (0.0.0.0), you can set any of the available UPF IPs here.
        # Do NOT set 0.0.0.0 as this is not a valid routable address.
        interfaces: # Interface list for this UPF
          - interfaceType: N3 # the type of the interface (N3 or N9)
            endpoints: # the IP address of this N3/N9 interface on this UPF
              - 5.5.5.2
              - 2001:db8::5:5:5:2
            networkInstances: # Data Network Name (DNN)
              - fast.t-mobile.com
              - internet
              - ims
              - sos
              - V5GA01INTERNET
              - vzwadmin
              - wnctest

    # the topology graph of userplane, A and B represent the two nodes of each link
    links:
      - A: gNB1
        B: UPF

  # retransmission timer for PDU session modification command
  t3591:
    enable: true # true or false
    expireTime: 16s # default is 6 seconds
    maxRetryTimes: 3 # the max number of retransmission

  # retransmission timer for PDU session release command
  t3592:
    enable: true # true or false
    expireTime: 16s # default is 6 seconds
    maxRetryTimes: 3 # the max number of retransmission

  nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem # NRF Certificate
  urrPeriod: 30 # default usage report period in seconds
  urrThreshold: 500000 # default usage report threshold in bytes
  requestedUnit: 1000

  # WNC: Router Advertisement Configuration for IPv6
  # Controls how SMF delivers Router Advertisements to UPF for forwarding to UEs
  routerAdvertisement:
    deliveryMethod: http  # Delivery method: "http" or "pfcp"
                          # - "http": Send RA via HTTP POST to UPF's /upf/v1/inject-ra endpoint (Phase 3.2.4)
                          #           Requires UPF's httpService.enable: true in upfcfg.yaml
                          # - "pfcp": Send RA via PFCP message to UPF (not yet implemented - Phase 3.2+)
                          # Default: "http" (recommended for now)
    upfHttpPort: 8080     # UPF HTTP server port (default: 8080)
                          # Must match the port configured in UPF's httpService.port

# Logging Configuration
logger:
  enable: true # true or false
  level: trace # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not, value: true or false
